name: BrainVibe PWA validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/manifest.json'
      - 'public/sw.js'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  validate-pwa:
    name: Build web app and validate PWA assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Verify PWA files are included
        run: |
          test -f dist/manifest.json
          test -f dist/sw.js
          echo "PWA manifest and service worker are included in the production build."
