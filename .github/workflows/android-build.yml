name: BrainVibe Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/manifest.json'
      - 'public/sw.js'
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  validate-pwa:
    name: Validate PWA files and web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Verify PWA files are included
        run: |
          test -f dist/manifest.json
          test -f dist/sw.js
          echo "PWA manifest and service worker are included in the production build."

  android-build:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-latest
    needs: validate-pwa
    if: ${{ vars.BRAINVIBE_ANDROID_BUILD_READY == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required Android signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.BRAINVIBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRAINVIBE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BRAINVIBE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing BRAINVIBE_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing BRAINVIBE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing BRAINVIBE_KEY_PASSWORD secret" && exit 1)
          echo "Signing secrets are present."
      - name: Explain remaining TWA setup
        run: |
          echo "The TWA Android project and its signing configuration must be generated from the deployed manifest before enabling this job."
          echo "Do not enable BRAINVIBE_ANDROID_BUILD_READY until the domain's Digital Asset Links file is deployed and verified."
